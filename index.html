        }

        function onlineCopyCode() {
            const text = online.code;
            try { navigator.clipboard.writeText(text).then(() => showToast('تم نسخ الرمز : ' + text), () => showToast('الرمز : ' + text)); }
            catch (e) { showToast('الرمز : ' + text); }
        }

        function onlineShareCode() {
            const payload = onlineJoinPayload(online.code);
            const url = payload !== online.code ? payload : '';
            const text = 'انضم إلى معركتي البحرية! رمز الغرفة : ' + online.code;
            if (navigator.share) navigator.share(url ? { title: 'المعركة البحرية', text, url } : { title: 'المعركة البحرية', text }).catch(() => {});
            else onlineCopyCode();
        }

        // ---------- Placement des flottes ----------
        function hostStartSetup() {
            if (!online.isHost || gameState.phase !== 'LOBBY') return;
            if (gameState.players.length < ONLINE_MIN_PLAYERS) { showToast('يلزم لاعبان على الأقل.'); return; }
            hostResetPlayers();
            online.submitted = false;
            online.lastEventHtml = ''; online.lastShot = null; online.shotSeq = 0; online.lastShotSeq = 0; online.gameOverHtml = ''; online.lastFx = null;
            gameState.timerStarted = false;
            gameState.myIdx = 0;
            gameState.phase = 'SETUP';
            gameState.players.forEach((p, i) => { if (i > 0 && p.connected) hostSendTo(p, hostSetupMessage(i)); });
            startPlayerSetup(0);
            hostBroadcastSetupStatus();
        }

        function hostSetupMessage(i) {
            const p = gameState.players[i];
            return { type: 'SETUP', players: gameState.players.map(x => x.name), you: i, duration: gameState.durationMinutes, ready: !!p.ready };
        }
        function hostSendSetup(i) { hostSendTo(gameState.players[i], hostSetupMessage(i)); }

        function hostBroadcastSetupStatus() {
            const ready = gameState.players.map(p => !!p.ready);
            const connected = gameState.players.map(p => !!p.connected);
            online.readyList = ready; online.connList = connected;
            onlineSendAll({ type: 'SETUP_STATUS', ready, connected });
        }

        function hostRefreshWaitingUI() {
            if (online.isHost && gameState.phase === 'SETUP' && online.submitted) renderSetupWaiting();
        }

        function onlineSubmitFleet() {
            const me = gameState.players[gameState.myIdx];
            if (!me || me.ships.length !== FLEET_TYPES.length) return;
            online.submitted = true;
            if (online.isHost) {
                me.ready = true;
                hostBroadcastSetupStatus();
                renderSetupWaiting();
                hostCheckAllReady();
            } else {
                onlineSendHost({ type: 'READY', ships: me.ships.map(s => ({ id: s.id, r: s.r, c: s.c, orientation: s.orientation })) });
                renderSetupWaiting();
            }
        }

        function hostBuildFleetFromShips(player, shipsData) {
            if (!Array.isArray(shipsData) || shipsData.length !== FLEET_TYPES.length) return false;
            const board = createEmptyBoard();
            const ships = [];
            for (const type of FLEET_TYPES) {
                const d = shipsData.find(s => s && s.id === type.id);
                if (!d) return false;
                const r = Number(d.r), c = Number(d.c);
                const o = d.orientation === 'V' ? 'V' : (d.orientation === 'H' ? 'H' : null);
                if (!Number.isInteger(r) || !Number.isInteger(c) || r < 0 || c < 0 || r >= GRID_SIZE || c >= GRID_SIZE || !o) return false;
                if (!canPlaceShip(board, type, r, c, o)) return false;
                for (let i = 0; i < type.size; i++) {
                    if (o === 'H') board[r][c + i] = type; else board[r + i][c] = type;
                }
                ships.push({ ...type, r, c, orientation: o, hits: 0 });
            }
            player.board = board;
            player.ships = ships;
            return true;
        }

        function hostOnReady(idx, msg) {
            if (gameState.phase !== 'SETUP') return;
            const p = gameState.players[idx];
            if (!p || p.ready) return;
            if (!hostBuildFleetFromShips(p, msg.ships)) {
                hostSendTo(p, { type: 'REJECT', code: 'fleet', text: 'أسطول غير صالح: أعد وضع سفنك.' });
                return;
            }
            p.ready = true;
            hostBroadcastSetupStatus();
            hostRefreshWaitingUI();
            hostCheckAllReady();
        }

        function hostCheckAllReady() {
            if (gameState.phase === 'SETUP' && gameState.players.every(p => p.ready)) hostBeginBattle();
        }

        function hostForceStart() {
            if (!online.isHost || gameState.phase !== 'SETUP') return;
            hostBeginBattle();
        }

        function renderSetupWaiting() {
            updateTimerDisplay();
            const players = gameState.players;
            const ready = online.isHost ? players.map(p => !!p.ready) : (online.readyList.length === players.length ? online.readyList : players.map((p, i) => i === gameState.myIdx));
            const conn = online.isHost ? players.map(p => p.connected) : (online.connList.length === players.length ? online.connList : players.map(() => true));
            const nReady = ready.filter(Boolean).length;
            const rows = players.map((p, i) => `
                <div class="flex items-center justify-between bg-sky-50 border-2 ${i === gameState.myIdx ? 'border-amber-400' : 'border-sky-200'} rounded-xl px-3 py-2">
                    <span class="font-bold text-sky-950 truncate">${p.name}${i === gameState.myIdx ? ' (أنت)' : ''}</span>
                    <span class="text-sm font-black whitespace-nowrap ${ready[i] ? 'text-emerald-600' : 'text-slate-400'}">${ready[i] ? '✅ جاهز' : (conn[i] === false ? '📴 غائب' : '⏳ يضع أسطوله…')}</span>
                </div>
            `).join('');
            document.getElementById('app-container').innerHTML = `
                <div class="bg-white/95 rounded-3xl p-5 sm:p-8 max-w-xl w-full shadow-2xl border-4 border-amber-400 text-center animate-pop">
                    <div class="inline-block bg-emerald-100 text-emerald-600 p-3 rounded-full mb-3 border-2 border-emerald-300"><i class="fa-solid fa-check text-3xl"></i></div>
                    <h2 class="text-2xl font-cartoon text-sky-900 mb-1">الأسطول جاهز!</h2>
                    <p class="text-slate-600 font-semibold mb-4">بانتظار باقي القباطنة… (${nReady} / ${players.length})</p>
                    <div class="space-y-2 mb-4 max-h-72 overflow-y-auto pr-1 text-left">${rows}</div>
                    ${online.isHost && nReady < players.length ? `
                        <button onclick="hostForceStart()" class="w-full btn-cartoon bg-amber-400 hover:bg-amber-300 text-sky-950 font-cartoon py-3 rounded-2xl border-2 border-amber-200">
                            ابدأ الآن
                        </button>
                        <p class="text-xs font-semibold text-slate-500 mt-2">اللاعبون غير الجاهزين بعد سيُوضع أسطولهم تلقائيًا.</p>
                    ` : ''}
                </div>
            `;
        }

        // ---------- Début de bataille, tours, tirs ----------
        function hostBeginBattle() {
            if (gameState.phase !== 'SETUP') return;
            gameState.players.forEach(p => { if (!p.ready) { placeAIShips(p); p.ready = true; } });
            hostRefreshDerived();
            gameState.phase = 'PLAYING';
            const present = gameState.players.map((p, i) => i).filter(i => gameState.players[i].connected);
            gameState.currentPlayerIdx = present.length ? present[Math.floor(Math.random() * present.length)] : 0;
            online.lastEventHtml = `⚓ جميع السفن جاهزة! <b>${gameState.players[gameState.currentPlayerIdx].name}</b> يفتح النار.`;
            online.lastShot = null;
            startGameTimer();
            hostScheduleSkipIfNeeded();
            online.prevTurn = -1;
            SFX.play('horn');
            hostPublish();
        }

        function hostStateFor(idx) {
            const players = gameState.players.map((p, i) => {
                const base = { id: i, name: p.name, connected: p.connected, isAI: false, isEliminated: p.isEliminated, shipsAlive: p.shipsAlive, receivedShots: p.receivedShots };
                if (i === idx) {
                    base.board = p.board;
                    base.ships = p.ships;
                } else {
                    // Les autres joueurs ne voient que les navires déjà coulés.
                    const sunk = p.ships.filter(s => s.hits >= s.size);
                    const board = createEmptyBoard();
                    sunk.forEach(s => {
                        const type = FLEET_TYPES.find(f => f.id === s.id) || s;
                        for (let k = 0; k < s.size; k++) {
                            const rr = s.r + (s.orientation === 'V' ? k : 0);
                            const cc = s.c + (s.orientation === 'H' ? k : 0);
                            if (rr < GRID_SIZE && cc < GRID_SIZE) board[rr][cc] = type;
                        }
                    });
                    base.board = board;
                    base.ships = sunk.map(s => ({ ...s }));
                }
                return base;
            });
            return {
                players, current: gameState.currentPlayerIdx, phase: gameState.phase,
                time: gameState.timeRemainingSeconds, duration: gameState.durationMinutes,
                eventHtml: online.lastEventHtml, lastShot: online.lastShot, fx: online.lastFx
            };
        }

        function hostPublish() {
            if (!online.isHost) return;
            hostRefreshDerived();
            gameState.players.forEach((p, i) => {
                if (i > 0 && p.connected) hostSendTo(p, { type: 'STATE', state: hostStateFor(i) });
            });
            online.firePending = false;
            tvBroadcast();
            if (gameState.phase === 'PLAYING' || gameState.phase === 'GAME_OVER') {
                renderGameUI();
                onlineMaybeShowShotModal(online.lastShot);
            }
            // Son « c'est votre tour »
            if (gameState.phase === 'PLAYING' && gameState.currentPlayerIdx !== online.prevTurn) {
                if (gameState.currentPlayerIdx === gameState.myIdx) SFX.play('turn', 0.8);
                online.prevTurn = gameState.currentPlayerIdx;
            }
        }

        function hostBroadcastTime() {
            onlineSendAll({ type: 'TIME', t: gameState.timeRemainingSeconds });
        }

        function hostAdvanceTurn() {
            TV.selected=null;
            const players = gameState.players, n = players.length, cur = gameState.currentPlayerIdx;
            let next = -1;
            for (let k = 1; k <= n; k++) { const i = (cur + k) % n; if (!players[i].isEliminated && players[i].connected) { next = i; break; } }
            if (next === -1) for (let k = 1; k <= n; k++) { const i = (cur + k) % n; if (!players[i].isEliminated) { next = i; break; } }
            gameState.currentPlayerIdx = next === -1 ? cur : next;
        }

        function hostScheduleSkipIfNeeded() {
            clearTimeout(online.skipTimer);
            if (gameState.phase !== 'PLAYING') return;
            const cur = gameState.players[gameState.currentPlayerIdx];
            if (!cur || cur.connected || cur.isEliminated) return;
            if (!gameState.players.some(p => p.connected && !p.isEliminated)) return;
            online.lastEventHtml += `<br>⏳ <b>${cur.name}</b> غائب: سيتم تجاوز دوره بعد ${Math.round(ONLINE_SKIP_DELAY_MS / 1000)} ثانية إن لم يعد.`;
            online.skipTimer = setTimeout(() => {
                if (gameState.phase !== 'PLAYING') return;
                const c = gameState.players[gameState.currentPlayerIdx];
                if (c && !c.connected) {
                    hostAdvanceTurn();
                    online.lastEventHtml = `⏭️ تم تجاوز دور <b>${c.name}</b> (منقطع الاتصال).`;
                    hostScheduleSkipIfNeeded();
                    hostPublish();
                }
            }, ONLINE_SKIP_DELAY_MS);
        }

        function hostProcessFire(s, t, r, c) {
            if (gameState.phase !== 'PLAYING') return;
            const players = gameState.players;
            if (s !== gameState.currentPlayerIdx) return;
            if (!Number.isInteger(t) || !Number.isInteger(r) || !Number.isInteger(c)) return;
            if (r < 0 || c < 0 || r >= GRID_SIZE || c >= GRID_SIZE) return;
            const shooter = players[s], target = players[t];
            tvSelect(s,t);
            if (!shooter || !target || t === s || target.isEliminated) return;
            if (target.receivedShots[r][c] !== 0) return;

            clearTimeout(online.skipTimer);
            const cell = target.board[r][c];
            const coord = coordHtml(r, c);
            let eventHtml, shooterHtml, sunk = false;
            const hit = !!cell;

            if (cell) {
                shooter.shots[r][c] = 2;
                target.receivedShots[r][c] = 2;
                shooter.hits = (shooter.hits || 0) + 1;
                const shipObj = target.ships.find(x => x.id === cell.id);
                if (shipObj) { shipObj.hits++; if (shipObj.hits >= shipObj.size) sunk = true; }
                if (sunk) {
                    eventHtml = `🌊💥 أغرق <b>${shooter.name}</b> سفينة <b>${target.name}</b> من نوع <b>${cell.name}</b>!`;
                    shooterHtml = `🌊💥 <span class="text-rose-600 font-cartoon">إصابة وغرق!</span> 🌊💦<br><span class="text-sky-500 font-bold">💥 انفجار! رذاذ الماء! 🌊</span><br>تم تدمير سفينة ${target.name} من نوع <b>${cell.name}</b>!`;
                } else {
                    eventHtml = `💥 أصاب <b>${shooter.name}</b> سفينة <b>${target.name}</b> في (${coord}).`;
                    shooterHtml = `💥 <span class="text-amber-500 font-cartoon">إصابة!</span><br>أُصيبت سفينة <b>${target.name}</b> في (${coord})!`;
                }
            } else {
                shooter.shots[r][c] = 1;
                target.receivedShots[r][c] = 1;
                eventHtml = `💦 أطلق <b>${shooter.name}</b> النار في الماء عند <b>${target.name}</b> في (${coord}).`;
                shooterHtml = `💦 <span class="text-sky-500 font-cartoon">في الماء...</span><br>لا شيء عند <b>${target.name}</b> في (${coord}).`;
            }

            hostRefreshDerived();
            if (target.shipsAlive === 0) {
                target.isEliminated = true;
                eventHtml += `<br>☠️ <b>${target.name}</b> لم يبقَ له أي سفينة وتم إقصاؤه!`;
                shooterHtml += `<br><br>☠️ <b>${target.name}</b> لم يبقَ له أي سفينة وتم إقصاؤه!`;
            }

            online.fxSeq++;
            online.lastFx = { seq: online.fxSeq, kind: hit ? (sunk ? 'sunk' : 'hit') : 'miss' };
            SFX.shot(online.lastFx.kind);

            const alive = players.filter(p => !p.isEliminated);
            if (alive.length <= 1) {
                const winner = alive[0] || shooter;
                online.lastEventHtml = eventHtml;
                online.lastShot = null;
                gameState.phase = 'GAME_OVER';
                stopGameTimer();
                updateTimerDisplay();
                hostPublish();
                onlineHostGameOver(`🏆 <span class="text-2xl font-cartoon text-amber-500">نصر ساحق!</span><br><br>أغرق <b>${winner.name}</b> جميع الأساطيل المعادية وفاز بالمعركة!`);
                return;
            }

            online.shotSeq++;
            online.lastShot = { seq: online.shotSeq, shooter: s, html: shooterHtml, button: hit ? 'العب مجددًا 🔥' : 'الدور التالي ⬅' };
            online.lastEventHtml = eventHtml;
            if (!hit) hostAdvanceTurn();
            hostScheduleSkipIfNeeded();
            hostPublish();
        }

        function onlineHostGameOver(html) {
            online.gameOverHtml = html;
            gameState.phase = 'GAME_OVER';
            stopGameTimer();
            clearTimeout(online.skipTimer);
            updateTimerDisplay();
            const winners = computeWinnerIdxs();
            online.gameOverWinners = winners;
            onlineSendAll({ type: 'GAME_OVER', html, winners });
            SFX.play(winners.includes(gameState.myIdx) ? 'victory' : 'defeat', 1.0);
            showModal(html, 'لعبة جديدة (الغرفة نفسها)', () => hostBackToLobby());
        }

        function hostBackToLobby() {
            if (!online.isHost) return;
            clearTimeout(online.skipTimer);
            stopGameTimer();
            gameState.players = gameState.players.filter((p, i) => i === 0 || p.connected);
            hostResetPlayers();
            gameState.phase = 'LOBBY';
            gameState.timerStarted = false;
            online.lastEventHtml = ''; online.lastShot = null; online.gameOverHtml = '';
            hostBroadcastLobby();
            renderLobby();
        }

        // ============================================================
        //  CÔTÉ JOUEUR (invité)
        // ============================================================
        function onlineJoinRoom(codeArg, nameArg) {
            if (!onlinePeerAvailable()) { setOnlineMenuMessage(ONLINE_NO_PEER_MSG); return; }
            const input = document.getElementById('join-code');
            const code = String(codeArg || (input ? input.value : '')).toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (code.length !== 5) { setOnlineMenuMessage('أدخل رمز الغرفة المكوّن من 5 خانات.'); return; }
            const nameEl = document.getElementById('p-name-0');
            const name = cleanPlayerName(nameArg || (nameEl ? nameEl.value : ''), 'قبطان');
            onlineTeardown(false);
            online.code = code;
            online.name = name;
            online.token = storageGet('bn_token_' + code) || randomToken();
            setOnlineMenuMessage('جارٍ الاتصال بالغرفة ' + code + '…', false);
            clientConnect();
        }

        function onlineResumeRoom() {
            const last = loadLastRoom();
            if (!last) { setOnlineMenuMessage('لا توجد لعبة لاستئنافها.'); return; }
            onlineJoinRoom(last.code, last.name);
        }

        function clientConnect() {
            let peer;
            try { peer = new Peer(); } catch (e) { onlineTeardown(false); setOnlineMenuMessage(ONLINE_NO_PEER_MSG); return; }
            online.peer = peer;
            online.hostConn = null;
            clearTimeout(online.connectTimer);
            online.connectTimer = setTimeout(() => {
                if (online.peer === peer && !online.active && !online.reconnecting) {
                    onlineTeardown(false);
                    setOnlineMenuMessage('تعذّر الوصول إلى الغرفة (انتهت المهلة). تحقّق من الرمز ومن اتصالك.');
                }
            }, 15000);

            peer.on('open', () => {
                if (online.peer !== peer) return;
                const conn = peer.connect(ONLINE_ROOM_PREFIX + online.code, { serialization: 'json', reliable: true });
                online.hostConn = conn;
                conn.on('open', () => {
                    if (online.peer !== peer) return;
                    try { conn.send({ type: 'JOIN', name: online.name, token: online.token }); } catch (e) {}
                });
                conn.on('data', msg => {
                    if (online.peer !== peer) return;
                    try { clientOnMessage(msg); } catch (e) { console.error(e); }
                });
                conn.on('close', () => { if (online.peer === peer) clientConnectionLost(); });
                conn.on('error', () => {});
            });
            peer.on('error', err => {
                if (online.peer !== peer) return;
                if (online.reconnecting) return; // la boucle de reconnexion réessaiera
                if (!online.active) {
                    onlineTeardown(false);
                    setOnlineMenuMessage(onlineErrorText(err));
                }
            });
        }

        function clientConnectionLost() {
            if (online.isHost || !online.active || online.reconnecting || online.hostClosed) return;
            online.reconnecting = true;
            online.reconnectAttempts = 0;
            try { if (online.hostConn) online.hostConn.close(); } catch (e) {}
            try { if (online.peer) online.peer.destroy(); } catch (e) {}
            showModal(`📡 <b>انقطع الاتصال</b><br>جارٍ إعادة الاتصال بالغرفة <b>${online.code}</b>…<br><span id="reconnect-attempt" class="text-sm text-slate-500"></span>`, 'مغادرة اللعبة', () => goHome());
            clientReconnectLoop();
        }

        function clientReconnectLoop() {
            if (!online.reconnecting) return;
            online.reconnectAttempts++;
            if (online.reconnectAttempts > 40) {
                online.reconnecting = false;
                showModal('تعذّرت إعادة الاتصال بالغرفة. ربما تم إغلاقها.', 'العودة إلى الرئيسية', () => goHome());
                return;
            }
            const el = document.getElementById('reconnect-attempt');
            if (el) el.textContent = 'المحاولة ' + online.reconnectAttempts;
            clientConnect();
            clearTimeout(online.reconnectTimer);
            online.reconnectTimer = setTimeout(() => {
                if (!online.reconnecting) return;
                try { if (online.hostConn) online.hostConn.close(); } catch (e) {}
                try { if (online.peer) online.peer.destroy(); } catch (e) {}
                clientReconnectLoop();
            }, 6000);
        }

        function clientOnMessage(msg) {
            if (!msg || typeof msg !== 'object') return;
            online.lastSeen = Date.now();
            switch (msg.type) {
                case 'HB':
                    return;
                case 'WELCOME': {
                    clearTimeout(online.connectTimer);
                    online.active = true;
                    online.myIdx = msg.idx;
                    online.token = msg.token || online.token;
                    online.code = msg.code || online.code;
                    online.lastShotSeq = Number(msg.shotSeq) || 0;
                    online.fxSeen = Number(msg.fxSeq) || 0;
                    gameState.mode = 'online';
                    gameState.myIdx = msg.idx;
                    storageSet('bn_token_' + online.code, online.token);
                    saveLastRoom(online.code, online.name);
                    if (online.reconnecting) {
                        online.reconnecting = false;
                        clearTimeout(online.reconnectTimer);
                        hideModalOverlay();
                        showToast('✅ تمت إعادة الاتصال!');
                    }
                    onlineStartHeartbeat();
                    onlineAcquireWakeLock();
                    return;
                }
                case 'LOBBY':
                    hideModalOverlay();
                    gameState.mode = 'online';
                    gameState.phase = 'LOBBY';
                    gameState.myIdx = msg.you; online.myIdx = msg.you;
                    gameState.durationMinutes = msg.duration;
                    gameState.timerStarted = false;
                    stopGameTimer();
                    online.lobby = { players: msg.players, you: msg.you, duration: msg.duration, code: msg.code,
                        link: (typeof msg.link === 'string' && msg.link.length <= 400 && (msg.link === msg.code || /^https?:\/\/[^\s"'<>]+$/i.test(msg.link))) ? msg.link : '' };
                    renderLobby();
                    return;
                case 'SETUP': {
                    hideModalOverlay();
                    gameState.mode = 'online';
                    gameState.myIdx = msg.you; online.myIdx = msg.you;
                    gameState.players = msg.players.map((n, i) => ({
                        id: i, name: n, isAI: false, connected: true, board: createEmptyBoard(), shots: createEmptyShotsBoard(),
                        receivedShots: createEmptyShotsBoard(), ships: [], shipsAlive: FLEET_TYPES.length, isEliminated: false
                    }));
                    gameState.durationMinutes = msg.duration;
                    gameState.timeRemainingSeconds = msg.duration * 60;
                    gameState.timerStarted = false;
                    online.submitted = !!msg.ready;
                    online.readyList = []; online.connList = [];
                    if (online.submitted) { gameState.phase = 'SETUP'; renderSetupWaiting(); }
                    else startPlayerSetup(msg.you);
                    return;
                }
                case 'SETUP_STATUS':
                    online.readyList = Array.isArray(msg.ready) ? msg.ready : [];
                    online.connList = Array.isArray(msg.connected) ? msg.connected : [];
                    if (gameState.phase === 'SETUP' && online.submitted) renderSetupWaiting();
                    return;
                case 'STATE':
                    clientApplyState(msg.state);
                    return;
                case 'TIME':
                    if (gameState.phase === 'PLAYING') {
                        gameState.timeRemainingSeconds = Number(msg.t) || 0;
                        gameState.timerStarted = true;
                        updateTimerDisplay();
                    }
                    return;
                case 'GAME_OVER':
                    gameState.phase = 'GAME_OVER';
                    stopGameTimer();
                    updateTimerDisplay();
                    SFX.play(Array.isArray(msg.winners) && msg.winners.includes(gameState.myIdx) ? 'victory' : 'defeat', 1.0);
                    showModal(String(msg.html || ''), 'مغادرة الغرفة', () => goHome());
                    return;
                case 'REJECT':
                    if (msg.code === 'fleet') {
                        online.submitted = false;
                        showToast(msg.text || 'أسطول غير صالح.');
                        startPlayerSetup(gameState.myIdx);
                        return;
                    }
                    hideModalOverlay();
                    goHome();
                    setOnlineMenuMessage(String(msg.text || 'تم رفض الاتصال.'));
                    return;
                case 'CLOSED':
                    online.hostClosed = true; // la coupure qui suit ne doit pas lancer de reconnexion
                    storageRemove('bn_last_room');
                    if (online.code) storageRemove('bn_token_' + online.code);
                    showModal('🚪 أغلق المضيف الغرفة.', 'العودة إلى الرئيسية', () => goHome());
                    return;
            }
        }

        function clientApplyState(st) {
            if (!st || !Array.isArray(st.players)) return;
            gameState.mode = 'online';
            gameState.players = st.players;
            gameState.currentPlayerIdx = st.current;
            gameState.phase = st.phase;
            gameState.durationMinutes = st.duration || gameState.durationMinutes;
            gameState.timeRemainingSeconds = st.time;
            gameState.timerStarted = true;
            gameState.myIdx = online.myIdx;
            online.lastEventHtml = st.eventHtml || '';
            online.firePending = false;
            // Effets sonores : tir, début de bataille, « c'est votre tour »
            const fxs = st.fx && Number(st.fx.seq);
            if (fxs > online.fxSeen) { online.fxSeen = fxs; SFX.shot(st.fx.kind); }
            if (st.phase === 'PLAYING' && online.prevPhase !== 'PLAYING') {
                if (!(online.prevPhase === '' && st.fx)) SFX.play('horn');
                online.prevTurn = -1;
            }
            if (st.phase === 'PLAYING' && st.current !== online.prevTurn) {
                if (st.current === gameState.myIdx) SFX.play('turn', 0.8);
                online.prevTurn = st.current;
            }
            online.prevPhase = st.phase;
            if (st.phase === 'PLAYING' || st.phase === 'GAME_OVER') {
                renderGameUI();
                onlineMaybeShowShotModal(st.lastShot);
            }
        }

        function onlineMaybeShowShotModal(ls) {
            if (!ls || ls.seq <= online.lastShotSeq) return;
            online.lastShotSeq = ls.seq;
            if (ls.shooter === gameState.myIdx && gameState.phase === 'PLAYING') {
                showModal(ls.html, ls.button, () => renderGameUI());
            }
        }

        // ---------- Tir (hôte et invités) ----------
        function onlineHandleFire(r, c) {
            if (gameState.phase !== 'PLAYING') return;
            const me = gameState.myIdx;
            if (gameState.currentPlayerIdx !== me) {
                const cur = gameState.players[gameState.currentPlayerIdx];
                showToast('⏳ ليس دورك' + (cur ? ' — ' + cur.name + ' يلعب' : '') + ' !');
                return;
            }
            const t = gameState.targetPlayerIdx;
            const target = gameState.players[t];
            if (!target || t === me || target.isEliminated) return;
            if (target.receivedShots[r][c] !== 0) return;
            if (online.firePending) return;
            online.firePending = true;
            clearTimeout(online.pendingTimer);
            online.pendingTimer = setTimeout(() => { online.firePending = false; }, 4000);
            if (online.isHost) hostProcessFire(me, t, r, c);
            else onlineSendHost({ type: 'FIRE', target: t, r, c });
        }

        // ---------- Bandeau d'information (liste des joueurs + dernier événement) ----------
        function onlineInfoHtml(viewerIdx) {
            const players = gameState.players;
            const chips = players.map((p, i) => {
                const isCur = i === gameState.currentPlayerIdx && gameState.phase === 'PLAYING';
                return `<span class="px-2 py-1 rounded-xl border-2 text-xs font-bold whitespace-nowrap flex items-center gap-1 ${isCur ? 'bg-amber-100 border-amber-500 text-sky-950 shadow-md' : 'bg-white border-slate-200 text-slate-700'} ${p.isEliminated ? 'opacity-50 line-through' : ''}">
                    <span class="inline-block w-2 h-2 rounded-full ${p.connected === false ? 'bg-slate-400' : 'bg-emerald-500'}"></span>${p.name}${i === viewerIdx ? ' (أنت)' : ''}
                    <span class="text-[10px] text-sky-700">⚓${p.isEliminated ? '☠️' : p.shipsAlive}</span>
                </span>`;
            }).join('');
            return `
                <div class="bg-white/95 p-2 sm:p-3 rounded-2xl shadow-lg border-4 border-sky-300">
                    <div class="flex flex-wrap gap-1.5">${chips}</div>
                    ${online.lastEventHtml ? `<div class="mt-2 text-sm font-semibold text-slate-700 bg-sky-50 border-2 border-sky-200 rounded-xl px-3 py-2">${online.lastEventHtml}</div>` : ''}
                </div>
            `;
        }


        // ============================================================
        //  REJOINDRE UNE SALLE PAR CODE OU PAR QR CODE
        //  - Salle d'attente : un QR code (généré localement) contient le lien / le code.
        //  - Menu : bouton « مسح رمز QR » qui lit le QR avec la caméra
        //    (ou depuis une photo si la caméra n'est pas disponible).
        // ============================================================
        let qrScan = { stream: null, timer: null, detector: null, busy: false, token: 0, done: false };

        // Une adresse est « publique » si d'autres appareils peuvent l'ouvrir.
        function onlineIsPublicHost(h) {
            h = String(h || '');
            return !!h && !/^(localhost|127\.|10\.|192\.168\.|0\.0\.0\.0)/.test(h) && !/\.local$/.test(h);
        }

        // Adresse du jeu si la page est déjà hébergée sur Internet.
        function onlineAutoPublicUrl(loc) {
            loc = loc || location;
            try {
                if ((loc.protocol === 'http:' || loc.protocol === 'https:') && onlineIsPublicHost(loc.hostname)) {
                    return String(loc.href).split('#')[0];
                }
            } catch (e) {}
            return null;
        }

        // Nettoie / valide l'adresse saisie par l'hôte (doit être une adresse publique en http(s)).
        function cleanGameUrl(raw) {
            const u = String(raw == null ? '' : raw).trim().split('#')[0].trim();
            if (!u || u.length > 300 || /[\s"'<>`\\]/.test(u)) return '';
            try {
                const x = new URL(u);
                if ((x.protocol !== 'http:' && x.protocol !== 'https:') || !onlineIsPublicHost(x.hostname)) return '';
            } catch (e) { return ''; }
            return u;
        }

        // Adresse du jeu enregistrée par l'hôte (utile quand la page est ouverte depuis un fichier local).
        function onlineSavedGameUrl() {
            return cleanGameUrl(storageGet('bn_game_url')) || null;
        }

        // Contenu du QR : lien qui ouvre directement la page d'accueil du jeu (avec le code de la salle),
        // sinon le code seul si aucune adresse publique n'est connue.
        function onlineJoinPayload(code, loc) {
            const base = onlineAutoPublicUrl(loc) || onlineSavedGameUrl();
            return base ? base + '#salle=' + code : code;
        }

        function onlineSaveGameUrl() {
            if (!online.isHost) return;
            const el = document.getElementById('game-url-input');
            const raw = el ? el.value.trim() : '';
            if (!raw) {
                storageRemove('bn_game_url');
                showToast('تم حذف رابط اللعبة.');
            } else {
                const u = cleanGameUrl(raw);
                if (!u) { showToast('رابط غير صالح. أدخل رابط اللعبة المنشورة على الإنترنت (https://…).'); return; }
                storageSet('bn_game_url', u);
                showToast('✅ تم حفظ الرابط');
            }
            hostBroadcastLobby();
            renderLobby();
        }

        function onlineQrSvg(payload) {
            try { return (typeof BNQR !== 'undefined') ? BNQR.svg(payload) : ''; } catch (e) { return ''; }
        }

        // Extrait le code (5 caractères) d'un lien ou d'un texte lu dans un QR.
        function parseRoomCode(text) {
            const t = String(text == null ? '' : text).trim();
            const m = t.match(/salle=([A-Za-z0-9]{5})(?![A-Za-z0-9])/);
            if (m) return m[1].toUpperCase();
            if (/^[A-Za-z0-9]{5}$/.test(t)) return t.toUpperCase();
            return null;
        }

        function qrSetScanMsg(text, isError) {
            const el = document.getElementById('qr-scan-msg');
            if (!el) return;
            el.textContent = text || '';
            el.classList.toggle('text-rose-600', !!isError);
            el.classList.toggle('text-sky-700', !isError);
        }

        function onlineOpenScanner() {
            if (document.getElementById('qr-scan-overlay')) return;
            const ov = document.createElement('div');
            ov.id = 'qr-scan-overlay';
            ov.className = 'fixed inset-0 z-[70] flex items-center justify-center p-4';
            ov.style.background = 'rgba(8, 47, 73, 0.92)';
            ov.innerHTML = `
                <div class="bg-white rounded-3xl border-4 border-amber-400 p-4 w-full max-w-sm text-center shadow-2xl">
                    <h3 class="font-cartoon text-xl text-sky-900 mb-1"><i class="fa-solid fa-qrcode mr-2"></i>مسح رمز QR</h3>
                    <p class="text-xs font-bold text-slate-500 mb-3">وجّه الكاميرا نحو رمز QR الخاص بالغرفة</p>
                    <div class="relative rounded-2xl overflow-hidden bg-black" style="aspect-ratio:1/1;">
                        <video id="qr-video" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;"></video>
                        <div style="position:absolute;inset:18%;border:4px solid #fbbf24;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,0.25);pointer-events:none;"></div>
                    </div>
                    <p id="qr-scan-msg" class="text-sm font-bold text-sky-700 mt-3" style="min-height:1.25rem;">جارٍ تشغيل الكاميرا…</p>
                    <div class="flex gap-2 mt-3">
                        <label class="flex-1 btn-cartoon bg-sky-500 hover:bg-sky-400 text-white font-cartoon py-2 rounded-xl border-2 border-sky-300 text-sm cursor-pointer">
                            اختيار صورة
                            <input id="qr-file" type="file" accept="image/*" style="display:none;">
                        </label>
                        <button onclick="onlineCloseScanner()" class="flex-1 btn-cartoon bg-rose-500 hover:bg-rose-400 text-white font-cartoon py-2 rounded-xl border-2 border-rose-300 text-sm">إلغاء</button>
                    </div>
                </div>`;
            document.body.appendChild(ov);
            document.getElementById('qr-file').addEventListener('change', qrOnFilePicked);
            qrScan.token++;
            qrScan.done = false;
            qrStartCamera(qrScan.token);
        }

        function onlineCloseScanner() {
            qrScan.token++;
            clearInterval(qrScan.timer);
            qrScan.timer = null;
            try { if (qrScan.stream) qrScan.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
            qrScan.stream = null;
            qrScan.busy = false;
            const ov = document.getElementById('qr-scan-overlay');
            if (ov) ov.remove();
        }

        // Détecteur : API native du navigateur si disponible, sinon jsQR (chargé à la demande).
        async function qrGetDecoder() {
            if (qrScan.detector) return qrScan.detector;
            try {
                if ('BarcodeDetector' in window) {
                    const formats = await BarcodeDetector.getSupportedFormats();
                    if (formats.includes('qr_code')) {
                        const det = new BarcodeDetector({ formats: ['qr_code'] });
                        qrScan.detector = async (src) => {
                            const r = await det.detect(src);
                            return r && r.length ? r[0].rawValue : null;
                        };
                        return qrScan.detector;
                    }
                }
            } catch (e) {}
            const jsQRfn = await qrLoadJsQR();
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            qrScan.detector = async (src) => {
                const sw = src.videoWidth || src.naturalWidth || src.width;
                const sh = src.videoHeight || src.naturalHeight || src.height;
                if (!sw || !sh) return null;
                const scale = Math.min(1, 720 / Math.max(sw, sh));
                canvas.width = Math.round(sw * scale);
                canvas.height = Math.round(sh * scale);
                ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
                const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const res = jsQRfn(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
                return res ? res.data : null;
            };
            return qrScan.detector;
        }

        function qrLoadJsQR() {
            return new Promise((resolve, reject) => {
                if (typeof window.jsQR === 'function') { resolve(window.jsQR); return; }
                const urls = [
                    'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js',
                    'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'
                ];
                let i = 0;
                const next = () => {
                    if (i >= urls.length) { reject(new Error('jsQR indisponible')); return; }
                    const sc = document.createElement('script');
                    sc.src = urls[i++];
                    sc.onload = () => (typeof window.jsQR === 'function') ? resolve(window.jsQR) : next();
                    sc.onerror = next;
                    document.head.appendChild(sc);
                };
                next();
            });
        }

        async function qrStartCamera(token) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                qrSetScanMsg('الكاميرا غير متاحة هنا. اختر صورة تحتوي على الرمز أو أدخل الرمز يدويًا.', true);
                return;
            }
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
            } catch (e) {
                if (token === qrScan.token) qrSetScanMsg('تعذّر تشغيل الكاميرا. اختر صورة تحتوي على الرمز أو أدخل الرمز يدويًا.', true);
                return;
            }
            if (token !== qrScan.token) { stream.getTracks().forEach(t => t.stop()); return; }
            qrScan.stream = stream;
            const video = document.getElementById('qr-video');
            if (!video) { stream.getTracks().forEach(t => t.stop()); return; }
            video.srcObject = stream;
            try { await video.play(); } catch (e) {}
            qrSetScanMsg('جارٍ البحث عن الرمز…', false);

            let decoder;
            try { decoder = await qrGetDecoder(); }
            catch (e) { if (token === qrScan.token) qrSetScanMsg('تعذّر تحميل أداة قراءة الرمز. أدخل الرمز يدويًا.', true); return; }
            if (token !== qrScan.token) return;

            let lastBad = 0;
            qrScan.timer = setInterval(async () => {
                if (token !== qrScan.token || qrScan.busy || qrScan.done) return;
                if (!video.videoWidth) return;
                qrScan.busy = true;
                try {
                    const text = await decoder(video);
                    if (text && token === qrScan.token && !qrScan.done) {
                        const code = parseRoomCode(text);
                        if (code) qrHandleCode(code);
                        else if (Date.now() - lastBad > 2000) { lastBad = Date.now(); qrSetScanMsg('هذا الرمز ليس رمز غرفة صالحًا.', true); }
                    }
                } catch (e) {}
                qrScan.busy = false;
            }, 250);
        }

        async function qrOnFilePicked(ev) {
            const file = ev.target.files && ev.target.files[0];
            ev.target.value = '';
            if (!file) return;
            qrSetScanMsg('جارٍ قراءة الصورة…', false);
            try {
                const decoder = await qrGetDecoder();
                const bmp = await createImageBitmap(file);
                const text = await decoder(bmp);
                const code = parseRoomCode(text);
                if (code) qrHandleCode(code);
                else qrSetScanMsg(text ? 'هذا الرمز ليس رمز غرفة صالحًا.' : 'لم يتم العثور على رمز QR في الصورة.', true);
            } catch (e) {
                qrSetScanMsg('تعذّرت قراءة الصورة. أدخل الرمز يدويًا.', true);
            }
        }

        function qrHandleCode(code) {
            qrScan.done = true;
            const input = document.getElementById('join-code');
            if (input) input.value = code;
            onlineCloseScanner();
            onlineJoinRoom(code);
        }

        // Démarrage automatique sur le menu au chargement
        window.onload = function() {
            if (new URLSearchParams(location.search).has('spectator')) return;
            renderMenu();
            const m = (location.hash || '').match(/salle=([A-Za-z0-9]{5})/);
            const joinInput = document.getElementById('join-code');
            if (m && joinInput) {
                joinInput.value = m[1].toUpperCase();
                setOnlineMenuMessage('تم إدخال رمز الغرفة — اكتب اسمك ثم اضغط «انضمام».', false);
            }
        };
    </script>
</body>
</html>
