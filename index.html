		throw new Error(num.length + "/" + shift);

		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},

		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {

		}
		
		for (var x = 0; x < e.getLength(); x++) {

        body {

        .font-cartoon {
            font-family: 'Cairo', 'Tahoma', 'Segoe UI', sans-serif;

        }

        /* Styles pour la mini-carte de défense */
        .mini-grid-cell {
            aspect-ratio: 1 / 1;
            font-size: 0.65rem;
        }

        /* Effet de vague en arrière-plan */
        .wave-bg {
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
        }

        /* Animation des grilles */
        .grid-cell {
            transition: all 0.2s ease-in-out;
            aspect-ratio: 1 / 1;
        }
        
        .grid-cell:hover:not(.disabled) {
            transform: scale(1.08);
            z-index: 10;
        }

        /* Animations personnalisées */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes splash {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-splash {
            animation: splash 0.4s ease-out forwards;
        }

        @keyframes impactPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.9); }
            25% { transform: scale(0.88); box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.75), 0 0 14px rgba(255, 87, 34, 0.9); }
            55% { transform: scale(1.12); box-shadow: 0 0 0 9px rgba(255, 193, 7, 0.25), 0 0 20px rgba(255, 87, 34, 0.75); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 193, 7, 0), 0 0 0 rgba(255, 87, 34, 0); }
        }

        .impact-cell {
            position: relative;
            overflow: visible;
            animation: impactPulse 0.7s ease-out both;
            z-index: 2;
        }

        .impact-cell .impact-ring {
            position: absolute;
            inset: -5px;
            border: 2px solid rgba(255, 193, 7, 0.9);
            border-radius: 9999px;
            pointer-events: none;
            z-index: 3;
            animation: impactPulse 0.7s ease-out both;
        }

        /* Effet n°6 : impacts successifs puis explosion finale lorsqu'un navire est coulé */
        @keyframes sunkImpactSequence {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 193, 7, 0); }
            18% { transform: scale(0.88); box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.85), 0 0 12px rgba(255, 87, 34, 0.8); }
            45% { transform: scale(1.12); box-shadow: 0 0 0 9px rgba(255, 193, 7, 0.25), 0 0 18px rgba(255, 87, 34, 0.75); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 193, 7, 0), 0 0 0 rgba(255, 87, 34, 0); }
        }

        @keyframes sunkFinalExplosion {
            0% { transform: scale(0.35); opacity: 0; filter: brightness(1); }
            35% { transform: scale(1.45); opacity: 1; filter: brightness(2); }
            65% { transform: scale(1.05); opacity: 1; filter: brightness(1.35); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        .sunk-cell {
            position: relative;
            overflow: visible;
            animation: sunkImpactSequence 0.7s ease-out both;
            animation-delay: var(--sunk-delay, 0s);
            box-shadow: 0 0 0 2px rgba(255, 71, 87, 0.55);
        }

        .sunk-cell .sunk-impact-ring {
            position: absolute;
            inset: -5px;
            border: 2px solid rgba(255, 193, 7, 0.9);
            border-radius: 9999px;
            pointer-events: none;
            z-index: 3;
            animation: sunkImpactSequence 0.7s ease-out both;
            animation-delay: var(--sunk-delay, 0s);
        }

        /* Explosion sur TOUTES les cases d'un navire coulé */
        .sunk-cell .sunk-explosion {
            position: absolute;
            inset: -8px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 4;
            font-size: 17px;
            animation: sunkFinalExplosion 0.8s ease-out both;
            animation-delay: var(--final-delay, 0s);
            text-shadow: 0 0 5px rgba(0,0,0,0.45);
        }

        /* La dernière case reçoit une explosion légèrement plus forte */
        .sunk-cell .sunk-final-explosion {
            font-size: 21px;
            animation-duration: 0.95s;
        }

        /* Ombre bouton cartoon */
        .btn-cartoon {
            box-shadow: 0px 6px 0px rgba(0, 0, 0, 0.25);
            transition: all 0.1s ease;
        }
        .btn-cartoon:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px rgba(0, 0, 0, 0.25);

        /* Custom Scrollbar */

            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 10px;
        }

    <script>
        // Configuration de la flotte classique de navires
        const FLEET_TYPES = [
            { id: 'carrier', name: 'حاملة الطائرات', size: 5, icon: 'fa-ship', color: 'bg-purple-500', border: 'border-purple-600' },
            { id: 'battleship', name: 'الطرّاد', size: 4, icon: 'fa-anchor', color: 'bg-indigo-500', border: 'border-indigo-600' },
            { id: 'destroyer', name: 'المدمّرة', size: 3, icon: 'fa-dharmachakra', color: 'bg-emerald-500', border: 'border-emerald-600' },
            { id: 'submarine', name: 'الغواصة', size: 3, icon: 'fa-water', color: 'bg-teal-500', border: 'border-teal-600' },
            { id: 'patrol', name: 'زورق الطوربيد', size: 2, icon: 'fa-life-ring', color: 'bg-rose-500', border: 'border-rose-600' }
        ];

        const GRID_SIZE = 10;
        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

        // État Global du Jeu
        let gameState = {
            mode: 'pve', // solo contre l'ordinateur
            numPlayers: 2,
            players: [], // Array de { id, name, isAI, board: [10][10], shots: [10][10], ships: [], isEliminated: false }
            currentPlayerIdx: 0,
            setupPlayerIdx: 0,
            selectedShipIndex: 0,
            orientation: 'H', // 'H' ou 'V'
            phase: 'MENU', // 'MENU', 'LOBBY', 'SETUP', 'TRANSITION', 'PLAYING', 'GAME_OVER'
            myIdx: -1, // index du joueur local (mode en ligne)
            targetPlayerIdx: 1, // Pour le tir
            durationMinutes: 10,
            timeRemainingSeconds: 600,
            timerStarted: false
        };

        let gameTimerInterval = null;

        // ============================================================
        //  EFFETS SONORES
        //  Tous les sons sont synthétisés par le navigateur (Web Audio) :
        //  aucun fichier audio à charger, ça fonctionne aussi hors ligne.
        //  Le bouton 🔊 de l'en-tête permet de couper / remettre le son.
        // ============================================================
        const SFX = (() => {
            let ctx = null, master = null, noiseBuf = null;
            let enabled = true;
            let lastTick = -1;
            try { enabled = localStorage.getItem('bn_sound') !== '0'; } catch (e) {}

            function ensure() {
                if (!ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return null;
                    try {
                        ctx = new AC();
                        const comp = ctx.createDynamicsCompressor();
                        master = ctx.createGain();
                        master.gain.value = 0.55;
                        master.connect(comp);
                        comp.connect(ctx.destination);
                        noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
                        const d = noiseBuf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                    } catch (e) { ctx = null; return null; }
                }
                if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
                return ctx;
            }

            // Note / son tonal avec glissando de fréquence et enveloppe
            function tone(type, f0, f1, t0, dur, vol, attack) {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(f0, t0);
                if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(vol, t0 + (attack || 0.005));
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                o.connect(g); g.connect(master);
                o.start(t0); o.stop(t0 + dur + 0.05);
            }

            // Bruit filtré (explosions, éclaboussures)
            function noise(t0, dur, vol, ftype, f0, f1, q) {
                const s = ctx.createBufferSource();
                s.buffer = noiseBuf;
                const fl = ctx.createBiquadFilter();
                fl.type = ftype || 'lowpass';
                fl.frequency.setValueAtTime(f0, t0);
                if (f1 && f1 !== f0) fl.frequency.exponentialRampToValueAtTime(Math.max(10, f1), t0 + dur);
                fl.Q.value = q || 0.7;
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                s.connect(fl); fl.connect(g); g.connect(master);
                s.start(t0, Math.random() * 0.8, dur + 0.05);
            }

            const SOUNDS = {
                // Coup de canon
                fire(t) {
                    tone('sine', 170, 45, t, 0.30, 0.9, 0.004);
                    noise(t, 0.20, 0.55, 'lowpass', 1900, 280);
                    tone('square', 95, 40, t, 0.10, 0.10, 0.003);
                },
                // Tir dans l'eau
                miss(t) {
                    noise(t, 0.60, 0.45, 'bandpass', 2300, 480, 0.8);
                    tone('sine', 720, 230, t + 0.02, 0.18, 0.20);
                    tone('sine', 520, 300, t + 0.26, 0.08, 0.10);
                    tone('sine', 640, 380, t + 0.36, 0.07, 0.08);
                },
                // Navire touché : explosion
                hit(t) {
                    noise(t, 0.75, 0.85, 'lowpass', 2600, 140);
                    tone('sine', 115, 28, t, 0.60, 0.95, 0.004);
                    tone('sawtooth', 230, 60, t, 0.30, 0.10, 0.004);
                    noise(t + 0.10, 0.07, 0.30, 'highpass', 3200, 3200);
                    noise(t + 0.22, 0.06, 0.22, 'highpass', 3600, 3600);
                },
                // Navire coulé : grosse explosion + gémissement + bulles
                sunk(t) {
                    noise(t, 1.15, 0.95, 'lowpass', 3000, 110);
                    tone('sine', 95, 24, t, 0.95, 1.0, 0.004);
                    noise(t + 0.38, 0.55, 0.55, 'lowpass', 1800, 120);
                    tone('sine', 85, 26, t + 0.38, 0.5, 0.6, 0.004);
                    tone('sawtooth', 380, 50, t + 0.20, 1.30, 0.12, 0.05);
                    for (let i = 0; i < 7; i++) {
                        const f = 280 + Math.random() * 520;
                        tone('sine', f, f + 220, t + 0.60 + i * 0.11, 0.09, 0.12);
                    }
                },
                // Fanfare de victoire
                victory(t) {
                    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('triangle', f, f, t + i * 0.14, 0.36, 0.34, 0.01));
                    [523.25, 659.25, 783.99, 1046.5].forEach(f => tone('triangle', f, f, t + 0.62, 1.0, 0.20, 0.02));
                    tone('sine', 261.63, 261.63, t + 0.62, 1.0, 0.25, 0.02);
                },
                // Mélodie de défaite
                defeat(t) {
                    [440, 392, 349.23, 293.66].forEach((f, i) => tone('triangle', f, f, t + i * 0.30, 0.55, 0.30, 0.02));
                    tone('sine', 146.83, 130.81, t + 1.2, 1.2, 0.35, 0.03);
                },
                // C'est votre tour
                turn(t) {
                    tone('sine', 880, 880, t, 0.14, 0.30, 0.005);
                    tone('sine', 1318.5, 1318.5, t + 0.12, 0.24, 0.30, 0.005);
                },
                // Clic de bouton
                click(t) { tone('triangle', 900, 600, t, 0.05, 0.14, 0.003); },
                // Navire posé
                place(t) {
                    tone('sine', 270, 130, t, 0.13, 0.42, 0.004);
                    noise(t, 0.05, 0.15, 'bandpass', 1500, 1500, 1);
                },
                // Placement impossible
                error(t) {
                    tone('square', 170, 150, t, 0.12, 0.12, 0.004);
                    tone('square', 150, 130, t + 0.14, 0.14, 0.12, 0.004);
                },
                // Un joueur rejoint la salle
                join(t) {
                    tone('sine', 660, 660, t, 0.10, 0.25, 0.005);
                    tone('sine', 880, 880, t + 0.10, 0.18, 0.25, 0.005);
                },
                // Tic-tac des dernières secondes
                tick(t) { tone('sine', 1000, 1000, t, 0.05, 0.16, 0.003); },
                // Corne de brume : début de la bataille
                horn(t) {
                    tone('triangle', 147, 147, t, 0.75, 0.40, 0.04);
                    tone('triangle', 220, 220, t, 0.75, 0.30, 0.04);
                    tone('sawtooth', 147, 147, t, 0.75, 0.07, 0.04);
                }
            };

            const api = {
                play(name, delay) {
                    if (!enabled) return;
                    if (!ensure() || ctx.state !== 'running') return;
                    try { if (SOUNDS[name]) SOUNDS[name](ctx.currentTime + 0.02 + (delay || 0)); } catch (e) {}
                },
                // Un tir : coup de canon puis résultat (water / hit / sunk)
                shot(kind) {
                    api.play('fire', 0);
                    api.play(kind === 'sunk' ? 'sunk' : (kind === 'hit' ? 'hit' : 'miss'), 0.30);
                },
                // Tic-tac pour chaque seconde des 10 dernières secondes
                tick(sec) {
                    if (sec > 10) { lastTick = -1; return; }
                    if (sec > 0 && sec !== lastTick) { lastTick = sec; api.play('tick', 0); }
                },
                unlock() { if (enabled) ensure(); },
                isEnabled() { return enabled; },
                toggle() {
                    enabled = !enabled;
                    try { localStorage.setItem('bn_sound', enabled ? '1' : '0'); } catch (e) {}
                    api.refreshButton();
                    if (enabled) { ensure(); api.play('click', 0.05); }
                },
                refreshButton() {
                    const i = document.getElementById('sound-toggle-icon');
                    if (i) {
                        i.classList.toggle('fa-volume-high', enabled);
                        i.classList.toggle('fa-volume-xmark', !enabled);
                    }
                    const b = document.getElementById('sound-toggle-btn');
                    if (b) {
                        b.setAttribute('aria-label', enabled ? 'إيقاف الصوت' : 'تشغيل الصوت');
                        b.setAttribute('title', enabled ? 'إيقاف الصوت' : 'تشغيل الصوت');
                        b.classList.toggle('opacity-60', !enabled);
                    }
                }
            };

            // Les navigateurs exigent un geste de l'utilisateur avant de jouer du son.
            ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev =>
                document.addEventListener(ev, () => api.unlock(), { passive: true, capture: true }));

            // Petit « clic » sur les boutons (sauf le bouton de son lui-même)
            document.addEventListener('click', (e) => {
                const t = e.target;
                const b = t && t.closest ? t.closest('button, .btn-cartoon') : null;
                if (b && !b.hasAttribute('data-nosound')) api.play('click', 0);
            }, true);

            api.refreshButton();
            return api;
        })();

        // Gagnants (indices) : le dernier survivant, ou — si le temps est écoulé — celui qui a le plus d'impacts.
        function computeWinnerIdxs() {
            const players = gameState.players;
            const alive = players.map((p, i) => i).filter(i => !players[i].isEliminated);
            if (players.length >= 2 && alive.length === 1) return alive;
            const scores = players.map(p => typeof p.hits === 'number' ? p.hits : (p.shots || []).reduce((tot, row) => tot + row.filter(v => v === 2).length, 0));
            const best = Math.max(...scores);
            return scores.map((s, i) => i).filter(i => scores[i] === best);
        }

        function stopGameTimer() {
            if (gameTimerInterval) {
                clearInterval(gameTimerInterval);
                gameTimerInterval = null;
            }
        }

        function formatTime(seconds) {
            const safe = Math.max(0, Number(seconds) || 0);
            const min = Math.floor(safe / 60).toString().padStart(2, '0');
            const sec = (safe % 60).toString().padStart(2, '0');
            return `${min}:${sec}`;
        }

        function startGameTimer() {
            stopGameTimer();
            gameState.timeRemainingSeconds = Math.max(60, Math.min(7200, Number(gameState.durationMinutes || 10) * 60));
            gameState.timerStarted = true;

            updateTimerDisplay();
            gameTimerInterval = setInterval(() => {
                if (gameState.phase !== 'PLAYING') {
                    stopGameTimer();
                    return;
                }

                gameState.timeRemainingSeconds = Math.max(0, gameState.timeRemainingSeconds - 1);
                updateTimerDisplay();
                if (gameState.mode === 'online' && online.isHost) hostBroadcastTime();

                if (gameState.timeRemainingSeconds <= 0) {
                    stopGameTimer();
                    endGameByTime();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const wrapper = document.getElementById('header-game-timer');
            const el = document.getElementById('game-timer');
            if (!wrapper || !el) return;

            const isVisible = !!gameState.timerStarted && gameState.phase === 'PLAYING';
            wrapper.classList.toggle('hidden', !isVisible);
            if (isVisible) SFX.tick(Number(gameState.timeRemainingSeconds) || 0);
            el.textContent = formatTime(gameState.timeRemainingSeconds);
            el.classList.toggle('text-rose-400', gameState.timeRemainingSeconds <= 60);
            el.classList.toggle('animate-pulse', gameState.timeRemainingSeconds <= 30);
        }

        function buildTimeUpHtml() {
            // En cas de temps écoulé, le gagnant est celui qui a réussi le plus de tirs.
            const scores = gameState.players.map(p => ({
                player: p,
                score: typeof p.hits === 'number' ? p.hits : (p.shots || []).reduce((total, row) => total + row.filter(v => v === 2).length, 0)
            }));
            const bestScore = Math.max(...scores.map(x => x.score));
            const winners = scores.filter(x => x.score === bestScore);

            let html = `⏱️ <span class="text-2xl font-cartoon text-rose-600">انتهى الوقت!</span><br><br>`;
            if (winners.length === 1) {
                html += `🏆 يفوز <b>${winners[0].player.name}</b> بالمعركة بـ <b>${bestScore}</b> من الإصابات الناجحة!`;
            } else {
                html += `🤝 <b>تعادل!</b><br>${winners.map(x => `<b>${x.player.name}</b> (${x.score} من الإصابات الناجحة)`).join(' — ')}`;
            }
            return html;
        }

        function endGameByTime() {
            if (gameState.phase === 'GAME_OVER') return;
            gameState.phase = 'GAME_OVER';
            stopGameTimer();
            updateTimerDisplay();
            const html = buildTimeUpHtml();

            if (gameState.mode === 'online') {
                if (online.isHost) { hostPublish(); onlineHostGameOver(html); }
                return;
            }
            SFX.play(computeWinnerIdxs().includes(0) ? 'victory' : 'defeat', 0.2);
            showModal(html, 'العب معركة جديدة', () => renderMenu());
        }

            if (range) range.value = minutes;
            if (input) input.value = minutes;

            gameState.mode = 'pve';
            gameState.players = [];
            
            const p1Name = document.getElementById('p-name-0').value.trim() || 'القبطان 1';
            gameState.players.push({ id: 0, name: p1Name, isAI: false, board: createEmptyBoard(), shots: createEmptyShotsBoard(), receivedShots: createEmptyShotsBoard(), ships: [], isEliminated: false });

            if (player.isAI) {

                nextSetupStep();

                startPlayerSetup(gameState.setupPlayerIdx + 1);

                // Tous les joueurs ont placé leurs navires -> Lancement du Jeu !
                gameState.phase = 'PLAYING';
                gameState.currentPlayerIdx = 0;
                gameState.targetPlayerIdx = 1;
                startGameTimer();
                showModal(`جميع السفن جاهزة للمعركة!<br><br>⏱️ ستستمر اللعبة <b>${gameState.durationMinutes} دقيقة</b>.`, 'أطلقوا النار!', () => { SFX.play('horn'); renderGameUI(); });

        }

        function selectShipToPlace(index) {

        function toggleOrientation() {
            gameState.orientation = gameState.orientation === 'H' ? 'V' : 'H';
            renderSetupUI();
        }

        function canPlaceShip(board, ship, r, c, orientation) {
            if (orientation === 'H') {
                if (c + ship.size > GRID_SIZE) return false;
                for (let i = 0; i < ship.size; i++) {
                    if (board[r][c + i] !== null) return false;
                }
            } else {
                if (r + ship.size > GRID_SIZE) return false;
                for (let i = 0; i < ship.size; i++) {
                    if (board[r + i][c] !== null) return false;
                }
            }
            return true;
        }

        function handleSetupCellClick(r, c) {
            const player = gameState.players[gameState.setupPlayerIdx];
            const currentShipType = FLEET_TYPES[gameState.selectedShipIndex];

            // Retirer le navire s'il est déjà placé
            player.ships = player.ships.filter(s => s.id !== currentShipType.id);
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (player.board[row][col] && player.board[row][col].id === currentShipType.id) {
                        player.board[row][col] = null;
                    }
                }
            }

            if (canPlaceShip(player.board, currentShipType, r, c, gameState.orientation)) {
                SFX.play('place');
                const placedShip = { ...currentShipType, r, c, orientation: gameState.orientation, hits: 0 };
                player.ships.push(placedShip);

                for (let i = 0; i < currentShipType.size; i++) {
                    if (gameState.orientation === 'H') {
                        player.board[r][c + i] = currentShipType;
                    } else {
                        player.board[r + i][c] = currentShipType;
                    }
                }

                // Sélectionner le prochain navire non placé
                const nextUnplacedIdx = FLEET_TYPES.findIndex(s => !player.ships.some(ps => ps.id === s.id));
                if (nextUnplacedIdx !== -1) {
                    gameState.selectedShipIndex = nextUnplacedIdx;
                }
            } else {
                SFX.play('error');
            }

            renderSetupUI();
        }

        function handleSetupCellHover(r, c) {
            clearCellPreviews();
            const player = gameState.players[gameState.setupPlayerIdx];
            const ship = FLEET_TYPES[gameState.selectedShipIndex];
            if (!ship) return;

            const isValid = canPlaceShip(player.board, ship, r, c, gameState.orientation);

            for (let i = 0; i < ship.size; i++) {
                let targetR = r + (gameState.orientation === 'V' ? i : 0);
                let targetC = c + (gameState.orientation === 'H' ? i : 0);

                if (targetR < GRID_SIZE && targetC < GRID_SIZE) {
                    const el = document.getElementById(`setup-cell-${targetR}-${targetC}`);
                    if (el) {
                        el.classList.add(isValid ? 'bg-amber-300' : 'bg-rose-400');
                    }
                }
            }
        }

        function clearCellPreviews() {
            document.querySelectorAll('.grid-cell').forEach(el => {
                el.classList.remove('bg-amber-300', 'bg-rose-400');
            });
        }

        function autoPlaceCurrentPlayerShips() {
            const player = gameState.players[gameState.setupPlayerIdx];
            placeAIShips(player);
            renderSetupUI();
        }

        function placeAIShips(player) {
            player.board = createEmptyBoard();
            player.ships = [];

            FLEET_TYPES.forEach(shipType => {
                let placed = false;
                while (!placed) {
                    const orientation = Math.random() < 0.5 ? 'H' : 'V';
                    const r = Math.floor(Math.random() * GRID_SIZE);
                    const c = Math.floor(Math.random() * GRID_SIZE);

                    if (canPlaceShip(player.board, shipType, r, c, orientation)) {
                        player.ships.push({ ...shipType, r, c, orientation, hits: 0 });
                        for (let i = 0; i < shipType.size; i++) {
                            if (orientation === 'H') {
                                player.board[r][c + i] = shipType;
                            } else {
                                player.board[r + i][c] = shipType;
                            }
                        }
                        placed = true;
                    }
                }
            });
        }

        function validateSetup() {
            const player = gameState.players[gameState.setupPlayerIdx];
            if (player.ships.length === FLEET_TYPES.length) {
                if (gameState.mode === 'online') {
                    onlineSubmitFleet();
                } else {
                    nextSetupStep();
                }
            }
        }

                    <!-- Layout Principal : Mini-carte à gauche + Grande Grille d'Attaque à droite -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        
                        <!-- MA FLOTTE : PANNEAU COMPACT / MINI-CARTE (4 Colonnes sur 12) -->
                        <div class="lg:col-span-4 bg-white/95 rounded-3xl p-3 sm:p-4 shadow-xl border-4 border-sky-400 flex flex-col items-center">
                            <div class="flex items-center justify-between w-full mb-2 px-1">
                                <div class="flex items-center space-x-2">
                                    <i class="fa-solid fa-radar text-sky-600 text-lg"></i>
                                    <h3 class="font-cartoon text-sm sm:text-base text-slate-800">أسطولي <span class="text-xs text-sky-600">(الدفاع)</span></h3>
                                </div>
                                <span class="text-[10px] font-bold bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full border border-sky-300">
                                    خريطة مصغّرة

                                </span>

                                <div class="grid grid-cols-11 gap-1 text-center font-cartoon text-sky-300 text-xs sm:text-sm mb-1">
                                    <div></div>
                                    ${Array.from({length: 10}, (_, i) => `<div>${i + 1}</div>`).join('')}
                                </div>

                                <div class="grid grid-rows-10 gap-1">
                                    ${Array.from({length: 10}, (_, r) => `
                                        <div class="grid grid-cols-11 gap-1 items-center">
                                            <div class="text-center font-cartoon text-sky-300 text-xs sm:text-sm">${LETTERS[r]}</div>
                                            ${Array.from({length: 10}, (_, c) => {
                                                const shotState = targetPlayer.receivedShots ? targetPlayer.receivedShots[r][c] : 0; // Résultat de tous les tirs reçus par ce joueur
                                                const cellShip = targetPlayer.board[r][c];
                                                const cellShipObj = cellShip ? targetPlayer.ships.find(s => s.id === cellShip.id) : null;
                                                const isSunkCell = shotState === 2 && cellShipObj && cellShipObj.hits >= cellShipObj.size;
                                                let sunkIndex = -1;
                                                let sunkCount = 0;
                                                if (isSunkCell) {
                                                    for (let sr = 0; sr < GRID_SIZE; sr++) {
                                                        for (let sc = 0; sc < GRID_SIZE; sc++) {
                                                            const boardCell = targetPlayer.board[sr][sc];
                                                            if (boardCell && boardCell.id === cellShipObj.id && targetPlayer.receivedShots[sr][sc] === 2) {
                                                                if (sr === r && sc === c) sunkIndex = sunkCount;
                                                                sunkCount++;
                                                            }
                                                        }
                                                    }
                                                }
                                                const isFinalSunkCell = isSunkCell && sunkIndex === sunkCount - 1;
                                                const sunkDelay = isSunkCell ? `${sunkIndex * 0.18}s` : '0s';
                                                const finalDelay = isFinalSunkCell ? `${sunkIndex * 0.18 + 0.45}s` : '0s';
                                                return `
                                                    <div onclick="handleFire(${r}, ${c})" 
                                                         style="--sunk-delay:${sunkDelay};--final-delay:${finalDelay};"
                                                         class="grid-cell bg-sky-700/80 rounded-lg cursor-pointer flex items-center justify-center border border-sky-500/30 ${
                                                            shotState === 1 ? 'bg-sky-400/50' : 
                                                            isSunkCell ? 'bg-rose-600 font-bold text-white sunk-cell' :
                                                            shotState === 2 ? 'bg-rose-500 font-bold text-white impact-cell' : 'hover:bg-amber-400/50'
                                                         }">
                                                        ${shotState === 1 ? '<i class="fa-solid fa-droplet text-sky-200 text-xs"></i>' : ''}
                                                        ${isSunkCell ? '<span class="sunk-impact-ring"></span>' : ''}
                                                        ${isSunkCell ? `<span class="sunk-explosion ${isFinalSunkCell ? 'sunk-final-explosion' : ''}">💥</span>` : ''}
                                                        ${shotState === 2 && !isSunkCell ? '<span class="impact-ring"></span><i class="fa-solid fa-crosshairs text-amber-200 text-sm"></i>' : ''}
                                                    </div>

                            <p class="text-xs font-semibold text-slate-500 mt-3 text-center">${isOnline && viewer.isEliminated ? '☠️ تم إقصاؤك — تتابع نهاية اللعبة.' : (isMyTurn ? 'انقر على خانة في منطقة الرمي لتنفيذ هجومك!' : '⏳ ليس دورك — انتظر، ' + currentPlayer.name + ' يلعب…')}</p>
                        </div>

                    </div>
                </div>
            `;
        }

        function changeTargetPlayer(targetIdx) {
            gameState.targetPlayerIdx = targetIdx;
            if (gameState.mode === 'online') { if(online.isHost)tvSelect(gameState.myIdx,targetIdx);else onlineSendHost({type:'TV_SELECT',target:targetIdx}); }
            renderGameUI();
        }

        function handleFire(r, c) {
            if (gameState.mode === 'online') { onlineHandleFire(r, c); return; }
            const currentPlayer = gameState.players[gameState.currentPlayerIdx];
            const targetPlayer = gameState.players[gameState.targetPlayerIdx];

            // Vérifier si la case a déjà été ciblée
            if (targetPlayer.receivedShots[r][c] !== 0) return;

            const targetShip = targetPlayer.board[r][c];
            let resultMessage = '';
            let isSunk = false;

            if (targetShip) {
                // TOUCHÉ !
                currentPlayer.shots[r][c] = 2; // Hit
                targetPlayer.receivedShots[r][c] = 2; // Résultat visible pour tous les joueurs
                
                // Mettre à jour le nombre de coups sur le navire adverse
                const shipObj = targetPlayer.ships.find(s => s.id === targetShip.id);
                if (shipObj) {
                    shipObj.hits++;
                    if (shipObj.hits >= shipObj.size) {
                        isSunk = true;
                    }
                }

                if (isSunk) {
                    resultMessage = `🌊💥 <span class="text-rose-600 font-cartoon">إصابة وغرق!</span> 🌊💦<br><span class="text-sky-500 font-bold">💥 انفجار! رذاذ الماء! 🌊</span><br>تم تدمير سفينة ${targetPlayer.name} من نوع <b>${targetShip.name}</b>!`;
                } else {
                    resultMessage = `💥 <span class="text-amber-500 font-cartoon">إصابة!</span><br>أُصيبت سفينة العدو في (${coordHtml(r, c)})!`;
                }
            } else {
                // À L'EAU !
                currentPlayer.shots[r][c] = 1; // Miss
                targetPlayer.receivedShots[r][c] = 1; // Résultat visible pour tous les joueurs
                resultMessage = `💦 <span class="text-sky-500 font-cartoon">في الماء...</span><br>لا شيء في (${coordHtml(r, c)}).`;
            }

            SFX.shot(targetShip ? (isSunk ? 'sunk' : 'hit') : 'miss');

            // Vérifier élimination du joueur cible
            const remainingTargetShips = targetPlayer.ships.filter(s => s.hits < s.size);
            if (remainingTargetShips.length === 0) {
                targetPlayer.isEliminated = true;
                resultMessage += `<br><br>☠️ <b>${targetPlayer.name}</b> لم يبقَ له أي سفينة وتم إقصاؤه!`;
            }

            // Vérifier fin de partie globale
            const activePlayers = gameState.players.filter(p => !p.isEliminated);
            if (activePlayers.length === 1) {
                // VICTOIRE FINAL !
                const victoryHtml = `🏆 <span class="text-2xl font-cartoon text-amber-500">نصر ساحق!</span><br><br>أغرق <b>${activePlayers[0].name}</b> جميع الأساطيل المعادية وفاز بالمعركة!`;
                gameState.phase = 'GAME_OVER';
                stopGameTimer();
                updateTimerDisplay();
                SFX.play('victory', 1.1);
                showModal(victoryHtml, 'العب معركة جديدة', () => renderMenu());
                return;
            }

            // Afficher le message d'action et passer au tour suivant
            const nextIsSamePlayer = !!targetShip;
            const modalButton = nextIsSamePlayer ? 'العب مجددًا 🔥' : 'الدور التالي ⬅';
            showModal(resultMessage, modalButton, () => {
                if (nextIsSamePlayer) {
                    renderGameUI();
                } else {
                    advanceTurn();
                }
            });
        }

        function advanceTurn() {
            // Trouver le prochain joueur vivant
            let nextPlayerIdx = (gameState.currentPlayerIdx + 1) % gameState.players.length;
            while (gameState.players[nextPlayerIdx].isEliminated) {
                nextPlayerIdx = (nextPlayerIdx + 1) % gameState.players.length;
            }

            gameState.currentPlayerIdx = nextPlayerIdx;
            const nextPlayer = gameState.players[nextPlayerIdx];

            // Si c'est au tour de l'IA
            if (nextPlayer.isAI) {
                playAITurn();
            } else {
                renderGameUI();
            }
        }

        function playAITurn() {
            const aiPlayer = gameState.players[gameState.currentPlayerIdx];
            // L'IA attaque le joueur humain (Index 0)
            const targetPlayer = gameState.players[0];

            let r, c;
            let validShot = false;

            // IA Simple / Recherche de tirs non effectués
            while (!validShot) {
                r = Math.floor(Math.random() * GRID_SIZE);
                c = Math.floor(Math.random() * GRID_SIZE);
                if (aiPlayer.shots[r][c] === 0) {
                    validShot = true;
                }
            }

            const targetShip = targetPlayer.board[r][c];
            let resultMessage = '';
            let aiKind = 'miss';

            if (targetShip) {
                aiPlayer.shots[r][c] = 2;
                targetPlayer.receivedShots[r][c] = 2;
                const shipObj = targetPlayer.ships.find(s => s.id === targetShip.id);
                if (shipObj) {
                    shipObj.hits++;
                }
                aiKind = (shipObj && shipObj.hits >= shipObj.size) ? 'sunk' : 'hit';
                resultMessage = `🤖 <b>${aiPlayer.name}</b> أطلق النار على (${coordHtml(r, c)}) و<span class="text-rose-600 font-bold">أصاب</span> سفينتك (${targetShip.name})!`;
            } else {
                aiPlayer.shots[r][c] = 1;
                targetPlayer.receivedShots[r][c] = 1;
                resultMessage = `🤖 <b>${aiPlayer.name}</b> أطلق النار في الماء عند (${coordHtml(r, c)}).`;
            }

            SFX.shot(aiKind);

            // Vérifier si l'humain est éliminé
            const humanShipsLeft = targetPlayer.ships.filter(s => s.hits < s.size);
            if (humanShipsLeft.length === 0) {
                SFX.play('defeat', 1.1);
                showModal(
                    `☠️ <span class="text-2xl font-cartoon text-rose-600">هزيمة...</span><br><br>دمّر الحاسوب أسطولك بالكامل!`,
                    'أعد اللعب',
                    () => renderMenu()
                );
                return;
            }

            showModal(resultMessage, 'دوري!', () => {
                gameState.currentPlayerIdx = 0; // Retour à l'humain
                renderGameUI();
            });
        }

        function showModal(htmlText, buttonText, onConfirm) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="text-lg text-slate-800 mb-6 leading-relaxed">${htmlText}</div>
                <button id="modal-confirm-btn" class="w-full btn-cartoon bg-amber-400 hover:bg-amber-300 text-sky-950 font-cartoon text-lg py-3 rounded-2xl border-2 border-amber-200">
                    ${buttonText}
                </button>
            `;

            overlay.classList.remove('hidden');

            document.getElementById('modal-confirm-btn').onclick = () => {
                overlay.classList.add('hidden');
                if (onConfirm) onConfirm();
            };
        }

        function goHome() {
            onlineCloseScanner();
            // Quitter proprement la salle en ligne (si besoin).
            onlineLeave();

            // Arrêter immédiatement le compte à rebours avant de quitter.
            stopGameTimer();

            // Réinitialiser uniquement l'état de la partie, sans modifier le design.
            gameState = {
                mode: 'pve',
                numPlayers: 2,
                players: [],
                currentPlayerIdx: 0,
                setupPlayerIdx: 0,
                selectedShipIndex: 0,
                orientation: 'H',
                phase: 'MENU',
                myIdx: -1,
                targetPlayerIdx: 1,
                durationMinutes: 10,
                timeRemainingSeconds: 600,
                timerStarted: false
            };
            renderMenu();
        }

        function confirmGoHome() {
            if (gameState.phase === 'MENU') return;

            const leaveText = online.active
                ? (online.isHost
                    ? 'أنت المضيف: إذا غادرت فسيتم إغلاق الغرفة لجميع اللاعبين. هل تريد العودة إلى الرئيسية؟'
                    : 'هل تريد مغادرة الغرفة؟ يمكنك العودة بالرمز <b>' + online.code + '</b>.')
                : 'هل تريد فعلًا التخلي عن اللعبة الحالية والعودة إلى الرئيسية؟';
            showModal(
                leaveText,
                'نعم، العودة إلى الرئيسية',
                () => goHome()
            );
        }

        // ============================================================
        //  MODE MULTIJOUEUR EN LIGNE (2 à 12 joueurs, un appareil par joueur)
        //  L'hôte (créateur de la salle) fait autorité : il garde toutes les flottes
        //  et n'envoie à chaque joueur que ce qu'il a le droit de voir.
        //  Un joueur déconnecté peut revenir avec le code de la salle.
        // ============================================================
        const ONLINE_MIN_PLAYERS = 2;
        const ONLINE_MAX_PLAYERS = 12;
        const ONLINE_ROOM_PREFIX = 'bnavale-touche-coule-';
        const ONLINE_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const ONLINE_TIMEOUT_MS = 15000;
        let ONLINE_SKIP_DELAY_MS = 25000;
        const ONLINE_NO_PEER_MSG = 'تعذّر تحميل وحدة الاتصال عبر الإنترنت (PeerJS). تحقّق من اتصالك بالإنترنت.';

        function onlineFreshState() {
            return {
                active: false, isHost: false, peer: null, code: '', name: '', token: '', myIdx: -1,
                conns: {}, hostConn: null, lobby: null, readyList: [], connList: [], submitted: false,
                reconnecting: false, reconnectAttempts: 0, reconnectTimer: null,
                skipTimer: null, hbTimer: null, connectTimer: null, pendingTimer: null, lastSeen: 0,
                lastEventHtml: '', lastShot: null, lastShotSeq: 0, shotSeq: 0, gameOverHtml: '',
                fxSeq: 0, lastFx: null, fxSeen: 0, prevTurn: -1, prevPhase: '', gameOverWinners: [], lobbyCount: 0,
                firePending: false, wakeLock: null, hostClosed: false
            };
        }
        let online = onlineFreshState();

        // ---------- Outils ----------
        function cleanPlayerName(raw, fallback) {
            const n = String(raw == null ? '' : raw).replace(/[<>&"'`\\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20);
            return n || fallback;
        }

        function randomFromChars(chars, len) {
            const a = new Uint32Array(len);
            try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < len; i++) a[i] = Math.floor(Math.random() * 4294967295); }
            let s = '';
            for (let i = 0; i < len; i++) s += chars[a[i] % chars.length];
            return s;
        }
        function randomRoomCode() { return randomFromChars(ONLINE_CODE_CHARS, 5); }
        function randomToken() { return randomFromChars('abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', 24); }

        function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function storageRemove(k) { try { localStorage.removeItem(k); } catch (e) {} }
        function saveLastRoom(code, name) { storageSet('bn_last_room', JSON.stringify({ code, name })); }
        function loadLastRoom() {
            try {
                const o = JSON.parse(storageGet('bn_last_room') || 'null');
                if (o && /^[A-Z0-9]{5}$/.test(o.code)) return { code: o.code, name: cleanPlayerName(o.name, 'قبطان') };
            } catch (e) {}
            return null;
        }

        function hideModalOverlay() {
            const o = document.getElementById('modal-overlay');
            if (o) o.classList.add('hidden');
        }

        function showToast(text) {
            const old = document.getElementById('bn-toast');
            if (old) old.remove();
            const el = document.createElement('div');
            el.id = 'bn-toast';
            el.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-sky-950 text-white font-bold px-4 py-2 rounded-2xl border-2 border-amber-300 shadow-xl text-sm max-w-[90vw] text-center';
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 2500);
        }

        function setOnlineMenuMessage(text, isError = true) {
            const el = document.getElementById('online-menu-msg');
            if (!el) { if (text) showToast(text); return; }
            el.textContent = text || '';
            el.classList.toggle('hidden', !text);
            el.classList.toggle('text-rose-600', !!isError);
            el.classList.toggle('text-sky-700', !isError);
        }

        function onlineErrorText(err) {
            const t = err && err.type;
            if (t === 'peer-unavailable') return 'الغرفة غير موجودة: تحقّق من الرمز (أو أن المضيف غادر الغرفة).';
            if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return 'تعذّر الوصول إلى خادم الاتصال. تحقّق من اتصالك بالإنترنت.';
            if (t === 'browser-incompatible') return 'هذا المتصفح لا يدعم الاتصال عبر الإنترنت.';
            return 'خطأ في الاتصال' + (t ? ' (' + t + ')' : '') + '.';
        }

        function onlinePeerAvailable() { return typeof Peer !== 'undefined'; }

        async function onlineAcquireWakeLock() {
            try {
                if (navigator.wakeLock && !online.wakeLock) {
                    online.wakeLock = await navigator.wakeLock.request('screen');
                    online.wakeLock.addEventListener('release', () => { online.wakeLock = null; });
                }
            } catch (e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && online.active) {
                const now = Date.now();
                online.lastSeen = now; // laisse un délai de grâce au retour de l'application
                if (online.isHost) gameState.players.forEach(p => { if (p.connected) p.lastSeen = now; });
                onlineAcquireWakeLock();
            }
        });

        // ---------- Fermeture / sortie ----------
        function onlineTeardown(graceful) {
            const old = online;
            online = onlineFreshState(); // les événements de l'ancienne session sont désormais ignorés
            clearInterval(old.hbTimer); clearTimeout(old.skipTimer); clearTimeout(old.reconnectTimer);
            clearTimeout(old.connectTimer); clearTimeout(old.pendingTimer);
            try { if (old.wakeLock) old.wakeLock.release(); } catch (e) {}
            const closeAll = () => {
                try { Object.values(old.conns).forEach(c => { try { c.close(); } catch (e) {} }); } catch (e) {}
                try { if (old.hostConn) old.hostConn.close(); } catch (e) {}
                try { if (old.peer) old.peer.destroy(); } catch (e) {}
            };
            if (graceful) setTimeout(closeAll, 400); else closeAll();
        }

        function onlineLeave() {
            if (online.active || online.peer) {
                try {
                    if (online.isHost) {
                        gameState.players.forEach((p, i) => { if (i > 0 && p.connected) hostSendTo(p, { type: 'CLOSED' }); });
                    } else if (online.hostConn && online.hostConn.open) {
                        online.hostConn.send({ type: 'LEAVE' });
                    }
                } catch (e) {}
                storageRemove('bn_last_room');
                if (online.code) storageRemove('bn_token_' + online.code);
                onlineTeardown(true);
            }
        }

        function onlineStartHeartbeat() {
            clearInterval(online.hbTimer);
            online.lastSeen = Date.now();
            online.hbTimer = setInterval(() => {
                if (!online.active) return;
                const now = Date.now();
                if (online.isHost) {
                    gameState.players.forEach((p, i) => {
                        if (i === 0 || !p.connected) return;
                        if (now - (p.lastSeen || 0) > ONLINE_TIMEOUT_MS) {
                            const c = online.conns[p.token];
                            try { if (c) c.close(); } catch (e) {}
                            hostMarkDisconnected(p.token, c);
                        }
                    });
                    onlineSendAll({ type: 'HB' });
                } else {
                    onlineSendHost({ type: 'HB' });
                    if (!online.reconnecting && now - online.lastSeen > ONLINE_TIMEOUT_MS) clientConnectionLost();
                }
            }, 3000);
        }

        // ---------- Envoi ----------
        function hostSend(conn, msg) { if (conn && conn.open) { try { conn.send(msg); } catch (e) {} } }
        function hostSendTo(p, msg) { if (p) hostSend(online.conns[p.token], msg); }
        function onlineSendAll(msg) { gameState.players.forEach((p, i) => { if (i > 0 && p.connected) hostSendTo(p, msg); }); }
        function onlineSendHost(msg) { if (online.hostConn && online.hostConn.open) { try { online.hostConn.send(msg); } catch (e) {} } }
        function hostReject(conn, code, text) {
            hostSend(conn, { type: 'REJECT', code, text });
            setTimeout(() => { try { conn.close(); } catch (e) {} }, 300);
        }

        // ============================================================
        //  CÔTÉ HÔTE
        // ============================================================

        // Mode écran public : connexion distincte, sans joueur supplémentaire.
        const TV = { connections: new Set(), selected: null, peer: null, conn: null, timer: null };
        function tvSnapshot() {
            return { type:'TV_STATE', phase:gameState.phase, selected:TV.selected,
                players:gameState.players.map(p=>({name:p.name, receivedShots:p.receivedShots, isEliminated:p.isEliminated})) };
        }
        function tvBroadcast() {
            if (!online.isHost) return;
            const data=tvSnapshot();
            TV.connections.forEach(c=>{if(c.open) hostSend(c,data);});
        }
        function tvSelect(shooter,target) {
            if (!online.isHost || gameState.phase!=='PLAYING' || shooter!==gameState.currentPlayerIdx) return;
            if (!Number.isInteger(target)||target===shooter||!gameState.players[target]||gameState.players[target].isEliminated) return;
            TV.selected=target; tvBroadcast();
        }
        // Présentation réservée à l'écran spectateur : mêmes grilles cartoon et effets de tirs que les joueurs.
        const tvPreviousShots = new Map();
        function tvBoard(p,large,index) {
            const shots=p.receivedShots||[];
            const previous=tvPreviousShots.get(index);
            let rows='';
            for(let r=0;r<GRID_SIZE;r++){
                let cells=`<div class="tv-axis">${LETTERS[r]}</div>`;
                for(let c=0;c<GRID_SIZE;c++){
                    const v=(shots[r]||[])[c]||0;
                    const changed=previous && (previous[r]||[])[c]!==v && v!==0;
                    const state=v===2?'tv-hit':v===1?'tv-miss':'';
                    cells+=`<div class="tv-cell ${state} ${changed?'tv-new-shot':''}" aria-label="${LETTERS[r]}${c+1}" >${v===2?'<i class="fa-solid fa-crosshairs"></i><span class="tv-impact-ring"></span>':v===1?'<i class="fa-solid fa-droplet"></i>':''}</div>`;
                }
                rows+=`<div class="tv-grid-row">${cells}</div>`;
            }
            return `<section class="tv-player-card ${large?'tv-player-large':''}"><h2 class="tv-player-name">⚓ ${tvEscape(p.name)} ${p.isEliminated?'☠️':''}</h2><div class="tv-board" dir="ltr"><div class="tv-grid-row"><div></div>${Array.from({length:GRID_SIZE},(_,i)=>`<div class="tv-axis">${i+1}</div>`).join('')}</div>${rows}</div></section>`;
        }
        function tvEscape(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        function tvRender(data){
            const el=document.getElementById('tv-root'); if(!el)return;
            const players=data.players||[];
            const selected=Number.isInteger(data.selected)?players[data.selected]:null;
            el.innerHTML=`<header class="tv-title">⚓ أسياد <span>البحار!</span> ⚓</header>`+
                (selected?`<div class="tv-target-heading">🎯 الهجوم على ${tvEscape(selected.name)}</div><div class="tv-focus">${tvBoard(selected,true,data.selected)}</div>`:
                `<div class="tv-all-boards">${players.map((p,i)=>tvBoard(p,false,i)).join('')}</div>`);
            players.forEach((p,i)=>tvPreviousShots.set(i,(p.receivedShots||[]).map(row=>Array.isArray(row)?row.slice():[])));
        }
        const tvStyle = `<style>
            #tv-root{background:radial-gradient(circle at 50% 0%,#136aa1 0%,#084572 42%,#062845 100%)!important;min-height:100vh;overflow-x:hidden;color:#fff;font-family:Cairo,Arial,sans-serif}
            #tv-root::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.14;background:repeating-radial-gradient(ellipse at 40% 120%,transparent 0 27px,#8cdbff 28px 30px,transparent 31px 64px);animation:tvWaves 12s linear infinite}
            .tv-title{position:relative;text-align:center;color:white;font-size:clamp(27px,4vw,56px);font-weight:900;text-shadow:0 4px 0 #07406a,0 8px 15px #001c35;margin:0 0 20px}.tv-title span{color:#fcd34d}
            .tv-target-heading{text-align:center;color:#fff;font-size:clamp(21px,3vw,38px);font-weight:900;margin-bottom:14px;text-shadow:0 3px 8px #03243c;animation:tvSlide .35s ease-out}
            .tv-all-boards{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:20px;align-items:start;max-width:1600px;margin:auto}
            .tv-focus{position:relative;max-width:960px;margin:auto;animation:tvSlide .4s ease-out}
            .tv-player-card{min-width:0;background:linear-gradient(150deg,#e0f2fe,#bae6fd);border:4px solid #fbbf24;border-radius:26px;padding:15px;box-shadow:0 9px 0 #075985,0 18px 32px #001c3566;color:#075985}
            .tv-player-large{padding:clamp(14px,3vw,30px);border-width:5px}
            .tv-player-name{font-weight:900;font-size:clamp(17px,2vw,25px);text-align:center;margin:0 0 12px;overflow-wrap:anywhere;text-shadow:0 1px 0 #fff}
            .tv-player-large .tv-player-name{font-size:clamp(24px,3.8vw,45px)}
            .tv-board{width:100%;max-width:460px;margin:auto;background:#075985;border:4px solid #0c4a6e;border-radius:22px;padding:clamp(5px,1vw,13px);box-shadow:inset 0 3px 10px #00273f88}
            .tv-player-large .tv-board{max-width:min(75vh,80vw,720px)}
            .tv-grid-row{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:clamp(2px,.45vw,5px);align-items:center;margin-bottom:clamp(2px,.45vw,5px)}
            .tv-axis{text-align:center;color:#bae6fd;font-size:clamp(8px,1.15vw,15px);font-weight:900;line-height:1.2}
            .tv-cell{position:relative;aspect-ratio:1;min-width:0;border:1px solid #7dd3fc55;border-radius:clamp(3px,.65vw,9px);background:#0369a1cc;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.65vw,23px);overflow:visible;box-shadow:inset 0 1px 2px #001c3540}
            .tv-cell.tv-hit{background:#f43f5e;color:#fef3c7;border-color:#fda4af;box-shadow:inset 0 2px 4px #88133766}
            .tv-cell.tv-miss{background:#38bdf866;color:#e0f2fe}
            .tv-cell .tv-impact-ring{position:absolute;inset:-5px;border:2px solid #fbbf24;border-radius:100%;opacity:0;pointer-events:none}
            .tv-new-shot.tv-hit{z-index:2;animation:impactPulse .7s ease-out both}
            .tv-new-shot.tv-hit .tv-impact-ring{opacity:1;animation:impactPulse .7s ease-out both}
            .tv-new-shot.tv-miss{animation:tvSplash .65s ease-out both}
            @keyframes tvSplash{0%{transform:scale(.5);opacity:.4}45%{transform:scale(1.17);filter:brightness(1.5)}100%{transform:scale(1);opacity:1}}
            @keyframes tvSlide{from{opacity:.3;transform:translateY(15px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
            @keyframes tvWaves{from{transform:translateY(0)}to{transform:translateY(-64px)}}
            @media(max-width:600px){#tv-root{padding:12px!important}.tv-all-boards{gap:15px}.tv-player-card{padding:10px}.tv-cell{font-size:clamp(9px,3vw,17px)}}
        </style>`;
        function tvStart(){
            const code=new URLSearchParams(location.search).get('spectator');
            if(!code)return false;
            document.head.insertAdjacentHTML('beforeend',tvStyle);
            document.body.innerHTML='<main id="tv-root" dir="rtl" style="min-height:100vh;background:#071a31;color:white;padding:20px;font-family:Cairo,Arial,sans-serif"><h1 style="text-align:center">جارٍ الاتصال بشاشة العرض…</h1></main>';
            if(typeof Peer==='undefined'){document.getElementById('tv-root').textContent='تعذر تحميل الاتصال';return true;}
            const connect=()=>{
                if(TV.peer)try{TV.peer.destroy()}catch(e){}
                const peer=new Peer();TV.peer=peer;
                peer.on('open',()=>{
                    const conn=peer.connect(ONLINE_ROOM_PREFIX+code.toUpperCase(),{serialization:'json',reliable:true});TV.conn=conn;
                    conn.on('open',()=>conn.send({type:'TV_JOIN'}));
                    conn.on('data',m=>{if(m&&m.type==='TV_STATE')tvRender(m)});
                    conn.on('close',()=>{document.getElementById('tv-root').innerHTML='<h1 style="text-align:center">انقطع الاتصال، جارٍ إعادة المحاولة…</h1>';});
                });
            };
            connect();TV.timer=setInterval(()=>{if(!TV.conn||!TV.conn.open)connect()},6000);
            return true;
        }
        if(new URLSearchParams(location.search).has('spectator')) {
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tvStart,{once:true});else tvStart();
        }

        function hostMakePlayer(name, token) {
            return {
                id: 0, name, token, connected: false, lastSeen: 0, isAI: false, ready: false, hits: 0,
                board: createEmptyBoard(), shots: createEmptyShotsBoard(), receivedShots: createEmptyShotsBoard(),
                ships: [], shipsAlive: FLEET_TYPES.length, isEliminated: false
            };
        }

        function hostReindex() { gameState.players.forEach((p, i) => { p.id = i; }); }

        function hostResetPlayers() {
            gameState.players.forEach((p, i) => {
                p.id = i; p.ready = false; p.hits = 0;
                p.board = createEmptyBoard(); p.shots = createEmptyShotsBoard(); p.receivedShots = createEmptyShotsBoard();
                p.ships = []; p.shipsAlive = FLEET_TYPES.length; p.isEliminated = false;
            });
        }

        function hostRefreshDerived() {
            gameState.players.forEach(p => { p.shipsAlive = p.ships.filter(s => s.hits < s.size).length; });
        }

        function onlineCreateRoom() {
            if (!onlinePeerAvailable()) { setOnlineMenuMessage(ONLINE_NO_PEER_MSG); return; }
            const nameEl = document.getElementById('p-name-0');
            const name = cleanPlayerName(nameEl ? nameEl.value : '', 'القبطان 1');
            changeGameDuration(document.getElementById('game-duration-input')?.value || gameState.durationMinutes || 10);
            onlineTeardown(false);
            online.isHost = true;
            online.name = name;
            setOnlineMenuMessage('جارٍ إنشاء الغرفة…', false);
            hostOpenPeer(0);
        }

        function hostOpenPeer(attempt) {
            const code = randomRoomCode();
            let peer;
            try { peer = new Peer(ONLINE_ROOM_PREFIX + code); } catch (e) { onlineTeardown(false); setOnlineMenuMessage('تعذّر إنشاء الغرفة.'); return; }
            online.peer = peer;
            peer.on('open', () => {
                if (online.peer !== peer) return;
                online.code = code;
                online.active = true;
                const me = hostMakePlayer(online.name, randomToken());
                me.connected = true; me.lastSeen = Date.now();
                gameState.players = [me];
                gameState.mode = 'online';
                gameState.myIdx = 0; online.myIdx = 0; online.token = me.token;
                gameState.phase = 'LOBBY';
                onlineStartHeartbeat();
                onlineAcquireWakeLock();
                renderLobby();
            });
            peer.on('connection', conn => hostOnConnection(peer, conn));
            peer.on('disconnected', () => { if (online.peer === peer) { try { peer.reconnect(); } catch (e) {} } });
            peer.on('error', err => {
                if (online.peer !== peer) return;
                if (err && err.type === 'unavailable-id' && attempt < 5 && !online.active) {
                    try { peer.destroy(); } catch (e) {}
                    online.peer = null;
                    hostOpenPeer(attempt + 1);
                    return;
                }
                if (!online.active) { onlineTeardown(false); setOnlineMenuMessage(onlineErrorText(err)); }
                else showToast(onlineErrorText(err));
            });
        }

        function hostOnConnection(peer, conn) {
            conn.on('data', msg => {
                if (online.peer !== peer) return;
                if (msg && msg.type === 'TV_JOIN') { TV.connections.add(conn); hostSend(conn,tvSnapshot()); return; }
                try { hostOnMessage(conn, msg); } catch (e) { console.error(e); }
            });
            conn.on('close', () => { TV.connections.delete(conn); if (online.peer === peer) hostMarkDisconnected(conn._token, conn); });
            conn.on('error', () => {});
        }

        function hostMarkDisconnected(token, conn) {
            if (!token) return;
            if (conn && online.conns[token] && online.conns[token] !== conn) return; // ancienne connexion déjà remplacée
            const idx = gameState.players.findIndex(p => p.token === token);
            if (idx <= 0) return;
            const p = gameState.players[idx];
            delete online.conns[token];
            if (!p.connected && gameState.phase !== 'LOBBY') return;
            p.connected = false;
            if (gameState.phase === 'LOBBY') {
                gameState.players.splice(idx, 1);
                hostReindex();
                hostBroadcastLobby();
                renderLobby();
                return;
            }
            if (gameState.phase === 'PLAYING') {
                online.lastEventHtml = `📴 انقطع اتصال <b>${p.name}</b>. يمكنه العودة برمز الغرفة.`;
                hostScheduleSkipIfNeeded();
                hostPublish();
            } else if (gameState.phase === 'SETUP') {
                hostBroadcastSetupStatus();
                hostRefreshWaitingUI();
            }
        }

        function hostOnMessage(conn, msg) {
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'JOIN') { hostOnJoin(conn, msg); return; }
            const token = conn._token;
            if (!token) return;
            const idx = gameState.players.findIndex(p => p.token === token);
            if (idx === -1) return;
            gameState.players[idx].lastSeen = Date.now();
            switch (msg.type) {
                case 'HB': break;
                case 'LEAVE': hostMarkDisconnected(token, conn); try { conn.close(); } catch (e) {} break;
                case 'READY': hostOnReady(idx, msg); break;
                case 'FIRE': hostProcessFire(idx, Number(msg.target), Number(msg.r), Number(msg.c)); break;
                case 'TV_SELECT': tvSelect(idx, Number(msg.target)); break;
            }
        }

        function hostOnJoin(conn, msg) {
            const players = gameState.players;
            const token = (typeof msg.token === 'string' && msg.token.length >= 8 && msg.token.length <= 64) ? msg.token : null;
            const name = cleanPlayerName(msg.name, 'قبطان');
            let idx = token ? players.findIndex(p => p.token === token) : -1;
            if (idx === 0) { hostReject(conn, 'name', 'هذا اللاعب هو بالفعل مضيف الغرفة.'); return; }
            if (idx === -1 && gameState.phase !== 'LOBBY') {
                // Retour par le nom (appareil changé, données effacées…) : uniquement pour un joueur absent
                idx = players.findIndex((p, i) => i > 0 && !p.connected && p.name.toLowerCase() === name.toLowerCase());
            }
            if (idx === -1) {
                if (gameState.phase !== 'LOBBY') { hostReject(conn, 'started', 'اللعبة بدأت بالفعل. لا يمكن إلا للاعبي اللعبة العودة (بالاسم نفسه).'); return; }
                if (players.length >= ONLINE_MAX_PLAYERS) { hostReject(conn, 'full', 'الغرفة ممتلئة (12 لاعبًا كحد أقصى).'); return; }
                let finalName = name, n = 2;
                while (players.some(p => p.name.toLowerCase() === finalName.toLowerCase())) {
                    finalName = cleanPlayerName(name.slice(0, 17) + ' ' + n, 'قبطان');
                    n++;
                }
                players.push(hostMakePlayer(finalName, token || randomToken()));
                idx = players.length - 1;
                hostReindex();
            } else {
                // Reconnexion : on détache l'ancienne connexion AVANT de la fermer,
                // pour que sa fermeture ne soit pas prise pour un départ du joueur.
                const tok = players[idx].token;
                const old = online.conns[tok];
                if (old && old !== conn) {
                    old._token = null;
                    delete online.conns[tok];
                    try { old.close(); } catch (e) {}
                }
            }
            const p = players[idx];
            conn._token = p.token;
            online.conns[p.token] = conn;
            p.connected = true;
            p.lastSeen = Date.now();
            hostSend(conn, { type: 'WELCOME', idx, token: p.token, code: online.code, shotSeq: online.shotSeq, fxSeq: online.fxSeq });

            if (gameState.phase === 'LOBBY') {
                hostBroadcastLobby();
                renderLobby();
            } else if (gameState.phase === 'SETUP') {
                hostSendSetup(idx);
                hostBroadcastSetupStatus();
                hostRefreshWaitingUI();
            } else if (gameState.phase === 'PLAYING') {
                online.lastEventHtml = `✅ عاد <b>${p.name}</b> إلى اللعبة!`;

                hostSend(conn, { type: 'STATE', state: hostStateFor(idx) });
                hostSend(conn, { type: 'GAME_OVER', html: online.gameOverHtml, winners: online.gameOverWinners });
            }
        }

                    </div>
                    ${online.isHost ? `<div style="margin:8px 0;padding:8px;border-radius:10px;background:#dbeafe;overflow-wrap:anywhere"><b>🖥️ شاشة العرض:</b> <a target="_blank" rel="noopener" href="${location.href.split('?')[0]}?spectator=${online.code}" style="color:#0369a1;text-decoration:underline">فتح شاشة المتفرجين</a></div>` : ''}
                    ${online.isHost && !onlineAutoPublicUrl() ? `

                            <p class="text-xs font-bold mb-1 ${qrIsLink ? 'text-emerald-700' : 'text-amber-700'}">${qrIsLink ? '✅ يفتح هذا الرمز صفحة اللعبة مباشرة.' : '⚠️ لكي يفتح الرمز صفحة اللعبة مباشرة، أدخل رابط اللعبة المنشورة على الإنترنت :'}</p>

                                <button onclick="onlineSaveGameUrl()" class="btn-cartoon bg-emerald-500 hover:bg-emerald-400 text-white font-cartoon px-4 rounded-xl border-2 border-emerald-300 text-sm">حفظ</button>

                    </div>
                    <div class="space-y-2 mb-5 max-h-72 overflow-y-auto pr-1 text-left">${rows}</div>
                    ${online.isHost ? `
                        <button onclick="hostStartSetup()" ${canStart ? '' : 'disabled'}
                            class="w-full btn-cartoon font-cartoon text-xl py-4 rounded-2xl border-2 text-white uppercase tracking-wide shadow-lg ${canStart ? 'bg-emerald-500 hover:bg-emerald-400 border-emerald-300' : 'bg-slate-300 border-slate-400 cursor-not-allowed opacity-50'}">
                            <i class="fa-solid fa-play mr-2"></i> ابدأ اللعبة
                        </button>
                        ${canStart ? '' : '<p class="text-xs font-bold text-slate-500 mt-2">يلزم لاعبان على الأقل للبدء.</p>'}
